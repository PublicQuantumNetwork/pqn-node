# MAKE SURE TO RENAME THIS FILE TO config.toml AND PLACE IT IN THE ROOT OF THE PROJECT

node_name = "example_node"

# Router configuration
router_name = "router1"
router_address = "xx.xx.xx.xx"  # Replace with actual IP address
router_port = 5555

# Address of the peer (follower) node used for two-player protocols (CHSH, QKD/SSM).
# The health check probes this address on startup and disables CHSH/SSM if unreachable.
follower_node_address = "xx.xx.xx.xx:8000"  # Replace with actual follower node address

# Rotary encoder serial adress
rotary_encoder_address = "/dev/tty.usbmodem1101"

# Timetagger configuration (provider_name, instrument_name)
timetagger = ["provider", "tagger"] # Replace with actual provider and instrument names

# Bell state configuration (default: Phi_plus)
bell_state = 0

# How this Node plays its two-player games: "entanglement" (entangled pairs, today's behaviour)
# or "correlation" (polarization-correlated pairs, for when entanglement is low)
operation_mode = "entanglement"

# CHSH experiment settings
[chsh_settings]
hwp = ["provider", "instrument_hwp"]  # Replace with actual HWP names
request_hwp = ["provider", "instrument_hwp"]
expectation_signs = [-1, 1, 1, 1]  # This is for HV + VH. for HH + VV, the signs are [1, -1, 1, 1]

# CHSH measurement configuration
[chsh_settings.measurement_config]
integration_time_s= 5
binwidth = 500
channel1 = 1
channel2 = 2
dark_count = 0

# QKD experiment settings
[qkd_settings]
hwp = ["provider", "instrument_hwp"]
request_hwp = ["provider", "instrument_hwp"]
bitstring_length = 4
discriminating_threshold = 10

# QKD measurement configuration
[qkd_settings.measurement_config]
integration_time_s = 5
binwidth = 500
channel1 = 1
channel2 = 2
dark_count = 0

# RNG / Quantum Fortune settings
[rng_settings]
channels = [1, 2]   # Timetagger channels to sample for singles parity
fortune_size = 8    # Number of parity measurements per fortune run

# The Calibrated angles: the waveplate angles this Node moves to for H, V, D and A.
# Defaults are today's values; set the real ones once the Node is aligned.
[polarization_angles]
h = 0.0
v = 45.0
d = 22.5
a = -22.5

# Settings for the correlation Operation mode
[correlation_settings]
# The Reference rates: expected coincidences per second for each pair of Answers, used only
# when this Node leads. Defaults assume a product-VV source at ~3000 coincidences/s.
[correlation_settings.reference_rates]
vv = 3000.0
vd = 1500.0
dd = 750.0