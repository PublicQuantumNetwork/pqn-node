[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Two deployables ship from this repo, so both modules must be named; the default is the
# one module matching the project name, which would silently omit pqn_whobot from a build.
module-name = ["pqn_node", "pqn_whobot"]


[project]
name = "pqn-node"
version = "0.2.0"
description = "FastAPI node service for the Public Quantum Network."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Benjamin Nussbaum", email = "bn9@illinois.edu" },
    { name = "Marcos Frenkel", email = "marcosf2@illinois.edu" },
    { name = "Soroush Hoseini", email = "soroushhoseini0@gmail.com" },
]
dependencies = [
    "pqn-hardware @ git+https://github.com/PublicQuantumNetwork/pqn-hardware.git@master",
    "fastapi[standard]>=0.115.14",
    "httpx>=0.28.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.10.1",
    "pyserial>=3.5",
    "tomlkit>=0.13.0",
    "typer>=0.15.1",
]

[project.optional-dependencies]
# Whobot's Chat Platform transport. Every Node ships Whobot's code but never runs it, so
# these stay out of the base dependencies and a Node deployment does not install them.
# Whobot's host installs them with `uv sync --extra whobot`; `whobot nodes` needs neither.
# aiohttp is explicit because slack-bolt's `[async]` extra was removed in 1.30, and async
# Socket Mode still needs it.
whobot = [
    "slack-bolt>=1.18",
    "aiohttp>=3.9",
]

[project.scripts]
pqn-node = "pqn_node.cli:app"
whobot = "pqn_whobot.cli:app"


[dependency-groups]
# The whobot extra is pulled in here so the Slack tests run with a plain `uv run pytest`.
# It stays an extra rather than a dev dependency because a Whobot host needs it in
# production, where dev groups are not installed.
dev = ["hypothesis", "mypy", "coverage", "pytest-randomly", "ruff", "pqn-node[whobot]"]


[tool.mypy]
files = ["src/**/*.py"]
strict = true
pretty = true

enable_error_code = ["ignore-without-code"]

ignore_missing_imports = true


[tool.ruff]
line-length = 120

[tool.ruff.lint]
# See https://docs.astral.sh/ruff/rules/ for details.
select = ["ALL"]
ignore = [
    "ANN",  # Let Mypy handle type annotations
    "D1",   # Don't warn about missing docstrings (but lint the ones that exist)
    "FIX",  # The linter doesnt need to remind us about TODOs
    "S301", # We use pickle
    "TD",   # We don't use this TODO style
]

# Ignore rules which are redundant when using the formatter.
# See https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules for details.
extend-ignore = [
    "W191",
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
    "Q",
    "COM812",
    "COM819",
    "ISC001",
    "ISC002",
    "E501",
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/*" = [
    "S101",   # Assert
    "ARG002", # A test double exists to have a signature, not to use every argument in it.
]
# Run pytest lint rules only in test files.
"!tests/*" = ["PT"]
# Allow "unused" imports when exposing objects from submodules.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "numpy" # One of: "google" | "numpy" | "pep257"


[tool.coverage.run]
# source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
skip_empty = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true
